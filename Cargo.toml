[package]
name = "zcode-acp"
version = "0.3.2"
edition = "2024"
license = "Apache-2.0"
description = "Native ACP adapter for ZCode, with Coding Plan and Start Plan quotas"
repository = "https://github.com/ichinya/zcode-acp"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
whoami = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "crypto-rust", "async-io"] }

[profile.release]
lto = "thin"
strip = true
